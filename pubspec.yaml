name: music_app
description: "Retro Beats — a neobrutalist music streaming app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Supabase (replaces all Firebase packages) ──
  supabase_flutter: ^2.0.0

  # ── Audio ──
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  just_audio_background: ^0.0.1-beta.17

  # ── UI ──
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1

  # ── State Management ──
  flutter_riverpod: ^3.3.1

  # ── Local Storage ──
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4

  # ── Networking ──
  http: ^1.3.0

  # ── Utilities ──
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
